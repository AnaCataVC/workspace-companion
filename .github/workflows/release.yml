name: Release Tauri App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Tauri Release (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Frontend Quality Gates (Svelte Check & Vite Build)
        run: |
          npm run check
          npm run build

      - name: Backend Quality Gates (Cargo Test)
        run: |
          cd src-tauri
          cargo test -- --nocapture

      - name: Build Tauri Desktop Package (NSIS)
        run: |
          npx tauri build

      - name: Package Release Deliverable
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $bundleDir = "src-tauri\target\release\bundle\nsis"
          $nsisExe = Get-ChildItem -Path $bundleDir -Filter "*.exe" | Select-Object -First 1

          if (-not $nsisExe) {
            Write-Error "No NSIS installer found in $bundleDir"
            exit 1
          }

          $destDir = "releases"
          if (-not (Test-Path $destDir)) {
            New-Item -ItemType Directory -Path $destDir | Out-Null
          }

          $finalExe = Join-Path $destDir "Workspace-Companion-${tag}-Setup.exe"
          Copy-Item -Path $nsisExe.FullName -Destination $finalExe -Force
          Write-Host "Created release deliverable: $finalExe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
